<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="40" viewBox="0 0 1200 40" font-family="'Segoe UI','Inter',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" role="img">
<defs><linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb" stop-opacity="0"/><stop offset=".5" stop-color="#7c3aed"/><stop offset="1" stop-color="#06b6d4" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter></defs>
<rect x="40" y="19" width="1120" height="2" rx="1" fill="url(#ln)"/>
<g transform="translate(300 20) rotate(45)"><rect x="-6" y="-6" width="12" height="12" fill="#2563eb"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.0s" repeatCount="indefinite"/></rect></g>
<g transform="translate(600 20) rotate(45)"><rect x="-6" y="-6" width="12" height="12" fill="#7c3aed"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="0.6s" repeatCount="indefinite"/></rect></g>
<g transform="translate(900 20) rotate(45)"><rect x="-6" y="-6" width="12" height="12" fill="#06b6d4"><animate attributeName="opacity" values=".3;1;.3" dur="2.4s" begin="1.2s" repeatCount="indefinite"/></rect></g>
<circle cy="20" r="6" fill="#fff" filter="url(#gl)" cx="40"><animate attributeName="cx" values="40;1160" dur="5s" begin="0s" repeatCount="indefinite"/></circle>
</svg>
