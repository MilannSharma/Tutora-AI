<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="300" viewBox="0 0 1060 300" font-family="'Segoe UI','Inter',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" role="img">
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b1020"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="5"/></filter></defs>
<rect width="1060" height="300" rx="24" fill="url(#bg)"/>
<text x="40" y="46" font-size="24" font-weight="800" fill="#f1f5f9" text-anchor="start" >⚡ Zero-failure failover</text>
<text x="40" y="70" font-size="14" font-weight="500" fill="#94a3b8" text-anchor="start" >Rate limit (HTTP 429) or quota hit? Tutora jumps to your next provider mid-generation.</text>
<path d="M130 150 H1000" stroke="#334155" stroke-width="3" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" values="0;-36" dur="1.2s" begin="0s" repeatCount="indefinite"/></path>
<circle cx="100" cy="150" r="34" fill="#2563eb"/><text x="100" y="162" font-size="30" font-weight="500" fill="#e5e7eb" text-anchor="middle" >🎙️</text><text x="100" y="206" font-size="14" font-weight="700" fill="#cbd5e1" text-anchor="middle" >Tutora AI</text>
<g><rect x="220" y="115" width="140" height="70" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/><text x="290" y="156" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle" >Gemini</text></g>
<g><rect x="390" y="115" width="140" height="70" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/><text x="460" y="156" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle" >Groq</text></g>
<g><rect x="560" y="115" width="140" height="70" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/><text x="630" y="156" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle" >OpenRouter</text></g>
<g opacity=".55"><rect x="730" y="115" width="140" height="70" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/><text x="800" y="156" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle" >OpenAI</text></g>
<g opacity=".55"><rect x="900" y="115" width="140" height="70" rx="14" fill="#0f172a" stroke="#475569" stroke-width="2"/><text x="970" y="156" font-size="18" font-weight="700" fill="#e2e8f0" text-anchor="middle" >Claude</text></g>
<g opacity="0"><rect x="220" y="115" width="140" height="70" rx="14" fill="#ef4444" fill-opacity=".18" stroke="#ef4444" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="0s" keyTimes="0.0000;0.0667;0.0875;0.2292;0.2500;1.0000" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="390" y="115" width="140" height="70" rx="14" fill="#ef4444" fill-opacity=".18" stroke="#ef4444" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="0s" keyTimes="0.0000;0.2667;0.2875;0.4125;0.4333;1.0000" repeatCount="indefinite"/></g>
<g opacity="0"><rect x="560" y="115" width="140" height="70" rx="14" fill="#10b981" fill-opacity=".18" stroke="#10b981" stroke-width="3"/><animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="0s" keyTimes="0.0000;0.4667;0.4875;0.8125;0.8333;1.0000" repeatCount="indefinite"/></g>
<g opacity="0"><text x="290" y="104" font-size="17" font-weight="800" fill="#ef4444" text-anchor="middle" >⛔ 429</text><animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="0s" keyTimes="0.0000;0.0667;0.0917;0.2250;0.2500;1.0000" repeatCount="indefinite"/></g>
<g opacity="0"><text x="460" y="104" font-size="17" font-weight="800" fill="#ef4444" text-anchor="middle" >⛔ quota</text><animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="0s" keyTimes="0.0000;0.2667;0.2917;0.4083;0.4333;1.0000" repeatCount="indefinite"/></g>
<g opacity="0"><text x="630" y="104" font-size="17" font-weight="800" fill="#10b981" text-anchor="middle" >✓ 200 OK</text><animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="0s" keyTimes="0.0000;0.4667;0.4917;0.8083;0.8333;1.0000" repeatCount="indefinite"/></g>
<circle cy="150" r="11" fill="#fff" opacity="1" cx="100"><animate attributeName="cx" values="100;290;290;460;460;630;630;100;100" dur="12s" begin="0s" keyTimes="0.0000;0.0667;0.2000;0.2667;0.4000;0.4667;0.8000;0.8833;1.0000" repeatCount="indefinite"/></circle>
<circle cy="150" r="18" fill="#fff" opacity="0.5" filter="url(#gl)" cx="100"><animate attributeName="cx" values="100;290;290;460;460;630;630;100;100" dur="12s" begin="0s" keyTimes="0.0000;0.0667;0.2000;0.2667;0.4000;0.4667;0.8000;0.8833;1.0000" repeatCount="indefinite"/></circle>
<g opacity="0"><text x="530.0" y="256" font-size="19" font-weight="700" fill="#ef4444" text-anchor="middle" >Gemini → HTTP 429 rate limit …</text><animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="0s" keyTimes="0.0000;0.0667;0.0875;0.2292;0.2500;1.0000" repeatCount="indefinite"/></g>
<g opacity="0"><text x="530.0" y="256" font-size="19" font-weight="700" fill="#ef4444" text-anchor="middle" >Groq → quota exceeded, switching …</text><animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="0s" keyTimes="0.0000;0.2667;0.2875;0.4125;0.4333;1.0000" repeatCount="indefinite"/></g>
<g opacity="0"><text x="530.0" y="256" font-size="19" font-weight="700" fill="#10b981" text-anchor="middle" >OpenRouter → ✓ script generation continues, no interruption</text><animate attributeName="opacity" values="0;0;1;1;0;0" dur="12s" begin="0s" keyTimes="0.0000;0.4667;0.4875;0.8125;0.8333;1.0000" repeatCount="indefinite"/></g>
</svg>
