<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="100" viewBox="0 0 1200 100" font-family="'Segoe UI','Inter',system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif" role="img">
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#0f172a"/><stop offset="1" stop-color="#1e1b4b"/></linearGradient>
<linearGradient id="sh" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="360" y2="0" spreadMethod="reflect">
  <stop offset="0" stop-color="#93c5fd"/><stop offset=".5" stop-color="#e9d5ff"/><stop offset="1" stop-color="#67e8f9"/>
  <animateTransform attributeName="gradientTransform" type="translate" values="0 0;360 0" dur="3.5s" repeatCount="indefinite"/>
</linearGradient>
<linearGradient id="ln" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#2563eb" stop-opacity="0"/><stop offset=".3" stop-color="#2563eb"/><stop offset=".7" stop-color="#7c3aed"/><stop offset="1" stop-color="#7c3aed" stop-opacity="0"/></linearGradient>
<filter id="gl" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4"/></filter>
</defs>
<rect width="1200" height="100" rx="20" fill="url(#bg)"/>
<rect x="1" y="1" width="1198" height="98" rx="19" fill="none" stroke="#ffffff" stroke-opacity=".08"/>
<g><animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="1.8s" begin="0s" repeatCount="indefinite"/><text x="34" y="60" font-size="40" font-weight="500" fill="#e5e7eb" text-anchor="start" >🤝</text></g>
<g opacity="0"><text x="100" y="54" font-size="38" font-weight="800" fill="url(#sh)" text-anchor="start" >Community &amp; Support</text><animate attributeName="opacity" values="0;1" dur="0.7s" begin="0.1s" fill="freeze"/><animateTransform attributeName="transform" type="translate" values="-40 0;0 0" dur="0.7s" begin="0.1s" fill="freeze"/></g>
<g opacity="0"><text x="102" y="76" font-size="15" font-weight="500" fill="#94a3b8" text-anchor="start" >Bugs, ideas and stars are all welcome</text><animate attributeName="opacity" values="0;1" dur="0.8s" begin="0.5s" fill="freeze"/></g>
<rect x="34" y="86" width="1132" height="3" rx="1.5" fill="url(#ln)" opacity=".8"/>
<circle cy="87.5" r="5" fill="#fff" filter="url(#gl)" cx="34"><animate attributeName="cx" values="34;1166" dur="4.5s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="0s" keyTimes="0;.1;.9;1" repeatCount="indefinite"/></circle>
<circle cy="87.5" r="2.5" fill="#fff" cx="34"><animate attributeName="cx" values="34;1166" dur="4.5s" begin="0s" repeatCount="indefinite"/><animate attributeName="opacity" values="0;1;1;0" dur="4.5s" begin="0s" keyTimes="0;.1;.9;1" repeatCount="indefinite"/></circle>
</svg>
